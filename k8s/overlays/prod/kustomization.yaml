apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Change these two values for your setup.
images:
  - name: transcriber
    newName: ghcr.io/kradnah/transcriber-k8s
    newTag: latest

patches:
  - target:
      kind: Ingress
      name: api
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: transcriber.julian-lizcano.com
      - op: replace
        path: /spec/rules/0/host
        value: transcriber.julian-lizcano.com
