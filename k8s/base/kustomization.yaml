apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: transcriber

labels:
  - pairs:
      app.kubernetes.io/part-of: transcriber
    includeSelectors: false

resources:
  - namespace.yaml
  - configmap.yaml
  - redis.yaml
  - api.yaml
  - worker.yaml
  - hpa.yaml
  - networkpolicy.yaml
  - ingress.yaml
